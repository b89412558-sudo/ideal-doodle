<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نفحات الطيب | بصمة سعادة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffaf0;color:#352b1b;font-family:Tahoma,Arial}
header{background:#fff;padding:12px 5%;border-bottom:1px solid #eadfc9;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
a{color:#896520;text-decoration:none;font-weight:bold}
main{max-width:1100px;margin:20px auto;padding:12px}
input,select{padding:12px;border:1px solid #dfd2b8;border-radius:10px;font:inherit}
button{border:0;border-radius:10px;padding:10px 14px;background:#b58a36;color:#fff;font-weight:bold;cursor:pointer;font-family:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
.light{background:#eee5d5;color:#40351f}
.brands,.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:20px 0}
.brand{background:#fff;border:2px solid #eadfc9;border-radius:20px;padding:12px;text-align:center;cursor:pointer}
.brand:hover,.cat:hover{border-color:#b58a36}
.brand img{width:100%;max-width:300px;border-radius:14px}
.cat{background:#fff;border:2px solid #eadfc9;border-radius:20px;padding:34px 10px;text-align:center;cursor:pointer;font-size:24px;font-weight:bold;color:#896520}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
.toolbar input{flex:1;min-width:170px}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:#fff;border:1px solid #eadfc9;border-radius:15px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0e8d8;display:block}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:12px}
.cardbody{padding:11px}
.card h3{margin:0 0 5px;font-size:16px}
.price{color:#896520;font-weight:bold;margin:6px 0}
.small{font-size:13px;color:#776d5c}
.panel{background:#fff;border:1px solid #eadfc9;border-radius:15px;padding:17px;margin:20px 0}
.cartrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee2cc}
.cartrow img{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#f0e8d8}
.grow{flex:1}
.qty{display:flex;align-items:center;gap:8px}
.qty button{padding:6px 11px}
label{display:block;margin:12px 0 5px;color:#776d5c;font-size:13px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.formgrid input,.formgrid select{width:100%}
.total{font-size:20px;font-weight:bold;color:#896520;margin:15px 0}
#status{background:#f4ecd9;border-radius:10px;padding:10px;margin:12px 0;font-size:13px}
.empty{padding:20px;text-align:center;color:#776d5c}
#done{display:none;background:#e8f5e4;border:1px solid #b9dcb0;text-align:center}
#wa{display:inline-block;background:#25a244;color:#fff;padding:12px 20px;border-radius:10px;font-weight:bold;margin-top:8px}
.crumb{display:flex;gap:10px;align-items:center;margin:8px 0}
.crumb h2{margin:0;color:#896520;font-size:20px}
/* نافذة المنتج */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;overflow-y:auto}
#sheet{background:#fff;max-width:640px;margin:0 auto;min-height:100%;position:relative;padding-bottom:30px}
#mclose{position:fixed;top:12px;left:12px;z-index:60;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:22px;padding:0}
.gal{position:relative;background:#f4eee0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;direction:ltr}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:min(100vw,560px);object-fit:contain;scroll-snap-align:center;cursor:zoom-in}
.arr{position:absolute;top:44%;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);color:#352b1b;font-size:22px;padding:0;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.arr.l{left:8px}.arr.r{right:8px}
.cnt{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 10px;border-radius:14px;direction:ltr}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:10px;direction:ltr}
.thumbs img{width:56px;height:56px;object-fit:cover;border:2px solid transparent;border-radius:8px;flex:0 0 auto;cursor:pointer;opacity:.7}
.thumbs img.on{border-color:#b58a36;opacity:1}
.mbody{padding:4px 18px}
.mbody h2{margin:6px 0;font-size:22px}
.mbody .price{font-size:24px}
.mbody p{line-height:1.8;white-space:pre-wrap}
#lb{position:fixed;inset:0;background:#000;display:none;z-index:80}
#lb img{width:100%;height:100%;object-fit:contain;touch-action:pinch-zoom}
</style>
</head>

async function loadProducts(){
 try{

 $("shop").style.display=brand?"block":"none";
 const pick=brand===B1&&!cat;
 $("catPick").style.display=pick?"grid":"none";
 $("list").style.display=(brand&&!pick)?"block":"none";
 $("title").textContent=brand?(brand+(cat&&cat!=="all"?" › "+cat:"")):"";
 renderProducts();
}

function renderProducts(){
 if(!brand)return;
 const q=$("search").value.trim().toLowerCase();
 let list=Object.entries(products).filter(([id,p])=>p&&
  (p.brand||B1)===brand&&(!cat||cat==="all"||p.category===cat)&&
  ((p.name||"")+" "+(p.description||"")).toLowerCase().includes(q));
 if($("sort").value==="low")list.sort((a,b)=>(a[1].price||0)-(b[1].price||0));
 if($("sort").value==="high")list.sort((a,b)=>(b[1].price||0)-(a[1].price||0));
 if(!list.length){$("products").innerHTML='<div class="empty">لا توجد منتجات حالياً.</div>';return}
 $("products").innerHTML=list.map(([id,p])=>{
  const out=Number(p.stock)<=0;
  return `<article class="card" data-act="open" data-id="${id}">
  <img loading="lazy" src="${safe(p.thumb||NOIMG)}" alt="${safe(p.name)}">
  ${Number(p.count)>1?`<span class="badge">📷 ${Number(p.count)}</span>`:""}
  <div class="cardbody"><h3>${safe(p.name)}</h3>
   <div class="price">${Number(p.price||0).toFixed(3)} ر.ع</div>
   <div class="small">${out?"نفدت الكمية":"متوفر: "+Number(p.stock)}</div>
   <button ${out?"disabled":""} data-act="add" data-id="${id}" style="width:100%;margin-top:8px">أضف إلى السلة</button></div></article>`}).join("");
}
$("search").oninput=renderProducts;
$("sort").onchange=renderProducts;

/* ---------- نافذة المنتج ---------- */
async function openProduct(id){
 if(!products[id])return;
 cur=id;renderModal();
 $("modal").style.display="block";document.body.style.overflow="hidden";
 history.pushState({m:1},"");
 $("modal").scrollTop=0;
 if(!full[id]&&Number(products[id].count)>0){
  try{
   const r=await fetch(DB+"/products/full/"+id+".json");
   const a=r.ok?await r.json():null;
   if(Array.isArray(a)&&a.length)full[id]=a.filter(Boolean);
   else if(a&&typeof a==="object")full[id]=Object.values(a);
   if(cur===id)renderModal();
  }catch(e){}
 }
}
function renderModal(){
 const p=products[cur];if(!p)return;
 const imgs=full[cur]||(p.thumb?[p.thumb]:[]);
 const out=Number(p.stock)<=0;
 $("sheet").innerHTML=`
 <div class="gal">
  <div class="slides" id="slides">${imgs.length?imgs.map(u=>`<img src="${safe(u)}" alt="" data-act="zoom">`).join(""):`<img src="${NOIMG}" alt="">`}</div>
  ${imgs.length>1?`<button class="arr l" data-act="prev">‹</button><button class="arr r" data-act="next">›</button><span class="cnt" id="cnt">1 / ${imgs.length}</span>`:""}
 </div>
 ${imgs.length>1?`<div class="thumbs" id="thumbs">${imgs.map((u,i)=>`<img src="${safe(u)}" alt="" data-act="thumb" data-i="${i}" class="${i?"":"on"}">`).join("")}</div>`:""}
 <div class="mbody">
  <h2>${safe(p.name)}</h2>
  <div class="small">${safe(p.brand||B1)}${p.category&&p.category!=="هدايا"?" · "+safe(p.category):""}</div>
  <div class="price">${Number(p.price||0).toFixed(3)} ر.ع</div>
  <div class="small">${out?"نفدت الكمية":"متوفر: "+Number(p.stock)}</div>
  <p>${safe(p.description||"")}</p>
  <button id="madd" ${out?"disabled":""} data-act="add" data-id="${cur}" style="width:100%;padding:14px;font-size:17px">أضف إلى السلة</button>
 </div>`;
}
function idx(){const s=$("slides");return s?Math.round(s.scrollLeft/s.clientWidth):0}
function showIdx(i){
 const s=$("slides");if(!s)return;
 s.scrollTo({left:i*s.clientWidth,behavior:"smooth"});
}
function updIdx(){
 const i=idx(),n=document.querySelectorAll("#slides img").length;
 if($("cnt"))$("cnt").textContent=(i+1)+" / "+n;
 document.querySelectorAll("#thumbs img").forEach((t,k)=>t.classList.toggle("on",k===i));
}
function hideModal(){$("modal").style.display="none";$("lb").style.display="none";document.body.style.overflow="";cur=null}
window.addEventListener("popstate",hideModal);
document.addEventListener("scroll",e=>{if(e.target&&e.target.id==="slides")updIdx()},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&cur)history.back()});
$("modal").addEventListener("click",e=>{if(e.target===$("modal"))history.back()});

/* ---------- السلة ---------- */
function addCart(id){
 const p=products[id];if(!p||Number(p.stock)<=0)return;
 cart[id]=Math.min((cart[id]||0)+1,Number(p.stock));renderCart();
}
function changeQty(id,n){
 cart[id]=(cart[id]||0)+n;
 if(cart[id]<=0)delete cart[id];else cart[id]=Math.min(cart[id],Number(products[id]?.stock||0));
 renderCart();
}
function renderCart(){
 const list=Object.entries(cart).filter(([id,q])=>products[id]&&q>0);
 $("count").textContent=list.reduce((s,[,q])=>s+q,0);
 if(!list.length){$("cartItems").className="empty";$("cartItems").innerHTML="السلة فارغة.";$("total").textContent="الإجمالي: 0.000 ر.ع";return}
 let total=0;$("cartItems").className="";
 $("cartItems").innerHTML=list.map(([id,q])=>{
  const p=products[id];total+=Number(p.price||0)*q;
  return `<div class="cartrow"><img src="${safe(p.thumb||NOIMG)}" alt="">
   <div class="grow"><b>${safe(p.name)}</b><div class="small">${safe(p.brand||B1)} · ${Number(p.price||0).toFixed(3)} ر.ع</div></div>
   <div class="qty"><button data-act="qty" data-id="${id}" data-n="-1">−</button><b>${q}</b>
   <button data-act="qty" data-id="${id}" data-n="1" ${q>=Number(p.stock)?"disabled":""}>+</button></div></div>`}).join("");
 $("total").textContent="الإجمالي: "+total.toFixed(3)+" ر.ع";
}

/* ---------- كل النقرات ---------- */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 const a=el.dataset.act,id=el.dataset.id;
 if(a==="home"){e.preventDefault();if(cur)history.back();go()}
 else if(a==="go")go(el.dataset.b,el.dataset.c);
 else if(a==="back")back();
 else if(a==="open")openProduct(id);
 else if(a==="add"){
  addCart(id);
  if(el.id==="madd"){el.textContent="تمت الإضافة ✓";setTimeout(()=>{if($("madd"))$("madd").textContent="أضف إلى السلة"},1200)}
 }
 else if(a==="qty")changeQty(id,Number(el.dataset.n));
 else if(a==="mclose")history.back();
 else if(a==="prev")showIdx(Math.max(0,idx()-1));
 else if(a==="next")showIdx(Math.min(document.querySelectorAll("#slides img").length-1,idx()+1));
 else if(a==="thumb")showIdx(Number(el.dataset.i));
 else if(a==="zoom"){$("lb").querySelector("img").src=el.src;$("lb").style.display="block"}
 else if(a==="lbclose")$("lb").style.display="none";
});

/* ---------- إرسال الطلب ---------- */
$("submit").onclick=async()=>{
 const name=$("customerName").value.trim(),phone=$("phone").value.trim();
 const notes=$("notes").value.trim(),payment=$("payment").value;
 const list=Object.entries(cart).filter(([id,q])=>products[id]&&q>0);
 if(!list.length){alert("السلة فارغة.");return}
 if(!name||!phone){alert("أدخل الاسم ورقم الهاتف.");return}
 if(!/^[0-9+\-\s]{7,20}$/.test(phone)){alert("تحقق من رقم الهاتف.");return}
 const btn=$("submit");btn.disabled=true;
 try{
  const items=[];let total=0;
  for(const [id,qty] of list){
   const p=products[id];
   if(Number(p.stock)<qty)throw new Error("الكمية غير كافية: "+p.name);
   items.push({productId:id,name:p.name,brand:p.brand||B1,price:Number(p.price||0),qty});
   total+=Number(p.price||0)*qty;
  }
  const r=await fetch(DB+"/orders.json",{method:"POST",body:JSON.stringify({customerName:name,phone,notes,payment,items,total,status:"جديد",createdAt:Date.now()})});
  if(!r.ok)throw new Error("تعذر حفظ الطلب ("+r.status+")");
  const no=(await r.json()).name.slice(-6);
  const lines=["طلب جديد","الاسم: "+name,"الهاتف: "+phone,"الدفع: "+payment,"----------------",
   ...items.map(i=>"["+i.brand+"] "+i.name+" × "+i.qty+" = "+(i.price*i.qty).toFixed(3)+" ر.ع"),
   "----------------","الإجمالي: "+total.toFixed(3)+" ر.ع","العنوان/ملاحظات: "+(notes||"-"),"رقم الطلب: "+no];
  $("wa").href="https://wa.me/"+MANAGER_WHATSAPP+"?text="+encodeURIComponent(lines.join("\n"));
  $("orderNo").textContent=no;$("done").style.display="block";
  $("done").scrollIntoView({behavior:"smooth"});
  cart={};renderCart();["customerName","phone","notes"].forEach(i=>$(i).value="");
 }catch(e){alert("لم يكتمل الطلب: "+e.message)}
 finally{btn.disabled=false}
};

window.addEventListener("error",e=>say("خطأ: "+e.message));
loadProducts();setInterval(loadProducts,20000);renderCart();
</script>
</body>
</html>
